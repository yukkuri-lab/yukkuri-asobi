<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fbf7e9"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>点つなぎ 陣取りゲーム</title><style>
:root{--paper:#fbf7e9;--pencil:#4d4a45;--soft:#777066;--rule:#bfd8ec;--margin:#e7b0a6;--panel:rgba(255,252,241,.82);--blue:#6f92bc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e5dc;color:var(--pencil)}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}button,a{font:inherit;color:inherit}.app{min-height:100dvh;max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom)) 46px;position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,var(--rule) 35px,transparent 36px)}.app:before{content:"";position:absolute;left:29px;top:0;bottom:0;width:1.5px;background:var(--margin)}.content{position:relative}.back{display:inline-block;text-decoration:none;font-size:14px;font-weight:800;background:rgba(255,255,255,.5);border:1px solid #a59d91;border-radius:999px;padding:8px 12px}h1{text-align:center;font-size:clamp(27px,7vw,42px);margin:12px 0 2px;text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:4px;text-underline-offset:9px}.sub{text-align:center;font-weight:800;margin:18px 0 0}.mode-area,.level-area{text-align:center;margin-top:13px}.label{font-size:13px;font-weight:900;color:var(--soft);margin-bottom:6px}.modes,.levels{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.mode,.level,.restart,.howto{min-height:44px;border:1.7px solid #8a8276;background:rgba(255,255,255,.56);border-radius:999px;padding:7px 12px;font-weight:800;box-shadow:1.5px 2px 0 rgba(78,75,70,.13);touch-action:manipulation}.mode[aria-pressed="true"],.level[aria-pressed="true"]{background:#e7edf4;border-color:#71859b}.level-note{text-align:center;margin-top:6px;font-size:12px;color:var(--soft);font-weight:700}.score{display:flex;justify-content:center;gap:9px;margin:13px auto 0;flex-wrap:wrap}.score span{background:rgba(255,255,255,.62);border:1px solid #d8cfbf;border-radius:10px;padding:7px 12px;font-weight:900}.score .turn{border-width:2px;border-color:#77899c}.board-wrap{width:min(91vw,540px);margin:12px auto 0}.board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}.guide{stroke:#b7b0a6;stroke-width:1.15;stroke-dasharray:2.2 2.5;opacity:.56}.drawn{stroke:var(--pencil);stroke-width:2.35;stroke-linecap:round;opacity:0}.drawn.show{opacity:.9}.hit{stroke:transparent;stroke-width:9;pointer-events:stroke}.disabled{pointer-events:none}.dot{fill:var(--pencil)}.boxmark{fill:var(--pencil);font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:central;opacity:.86}.status{max-width:540px;margin:10px auto 0;text-align:center;background:var(--panel);border:1px solid #d9cfbd;border-radius:13px;padding:9px 12px}.status-main{font-weight:900;font-size:clamp(17px,4.5vw,22px)}.status-sub{font-size:13px;color:var(--soft);font-weight:700;margin-top:2px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:11px}.restart{background:#e7edf3;border-color:#77889b}.rules{display:none;max-width:540px;margin:10px auto;background:rgba(255,255,255,.7);border:1px solid #d8cfbf;border-radius:13px;padding:11px 14px;font-size:14px;font-weight:700;line-height:1.7}.rules.open{display:block}.foot{text-align:center;font-size:12px;color:#6d665e;font-weight:700;margin-top:11px}@media(max-width:390px){.app{padding-left:39px;padding-right:8px}.app:before{left:24px}.mode,.level,.score span{font-size:12px}}
</style></head><body><main class="app"><div class="content"><a class="back" href="../">← もどる</a><h1>点つなぎ 陣取りゲーム</h1><p class="sub">せんを ひいて、しかくを たくさん とろう！</p><section class="mode-area"><div class="label">たいせん</div><div class="modes"><button class="mode" id="cpuBtn" aria-pressed="true">コンピューターと</button><button class="mode" id="friendBtn" aria-pressed="false">ふたりで</button></div></section><section class="level-area"><div class="label">むずかしさ</div><div class="levels"><button class="level" data-level="1" aria-pressed="true">① かんたん</button><button class="level" data-level="2" aria-pressed="false">② ふつう</button><button class="level" data-level="3" aria-pressed="false">③ むずかしい</button></div><div class="level-note" id="levelNote"></div></section><div class="score"><span id="scoreO">○ 0こ</span><span class="turn" id="turnBadge">○ のばん</span><span id="scoreX">× 0こ</span></div><div class="board-wrap"><svg class="board" id="board" viewBox="0 0 100 100"></svg></div><section class="status"><div class="status-main" id="statusMain">○ の ばんだよ</div><div class="status-sub" id="statusSub">あなたは ○。線を1本 タッチしてね</div></section><div class="actions"><button class="restart" id="restart">↻ もういちど</button><button class="howto" id="howto">？ あそびかた</button></div><div class="rules" id="rules">① 点と点のあいだを1本タッチ。<br>② 四角を完成させたら自分のもの。<br>③ 四角を取れたらもう1回。<br>④ 最後に四角をたくさん取った人の勝ち！</div><p class="foot">基本はコンピューター対戦。友だちと遊ぶときは「ふたりで」をタッチしてね。</p></div></main><script>
(()=>{const svg=document.getElementById('board'),statusMain=document.getElementById('statusMain'),statusSub=document.getElementById('statusSub'),scoreO=document.getElementById('scoreO'),scoreX=document.getElementById('scoreX'),turnBadge=document.getElementById('turnBadge'),levelNote=document.getElementById('levelNote'),cpuBtn=document.getElementById('cpuBtn'),friendBtn=document.getElementById('friendBtn'),restart=document.getElementById('restart'),howto=document.getElementById('howto'),rules=document.getElementById('rules'),levels=[...document.querySelectorAll('.level')],NS='http://www.w3.org/2000/svg',cfg={1:4,2:5,3:6};let n=4,turn='O',mode='cpu',edges={},boxes={},over=false,thinking=false;const h=(r,c)=>`h-${r}-${c}`,v=(r,c)=>`v-${r}-${c}`,b=(r,c)=>`b-${r}-${c}`;function E(name,a={}){const x=document.createElementNS(NS,name);Object.entries(a).forEach(([k,val])=>x.setAttribute(k,val));return x}function pos(i){return 10+i*(80/(n-1))}function adj(t,r,c){const a=[];if(t==='h'){if(r>0)a.push([r-1,c]);if(r<n-1)a.push([r,c])}else{if(c>0)a.push([r,c-1]);if(c<n-1)a.push([r,c])}return a}function complete(r,c,state=edges){return state[h(r,c)]&&state[h(r+1,c)]&&state[v(r,c)]&&state[v(r,c+1)]}function score(){let O=0,X=0;Object.values(boxes).forEach(x=>x==='O'?O++:x==='X'?X++:0);return{O,X}}function update(){const s=score();scoreO.textContent=`○ ${s.O}こ`;scoreX.textContent=`× ${s.X}こ`;turnBadge.textContent=over?'おしまい':thinking?'× かんがえちゅう':`${turn==='O'?'○':'×'} のばん`}function draw(id){const l=document.getElementById('l-'+id);if(!l)return;l.classList.add('show')}function mark(r,c,o){const t=document.getElementById('m-'+b(r,c));if(t)t.textContent=o==='O'?'○':'×'}function moves(){const a=[];for(let r=0;r<n;r++)for(let c=0;c<n-1;c++)if(!edges[h(r,c)])a.push({t:'h',r,c,id:h(r,c)});for(let r=0;r<n-1;r++)for(let c=0;c<n;c++)if(!edges[v(r,c)])a.push({t:'v',r,c,id:v(r,c)});return a}function sides(r,c){return [h(r,c),h(r+1,c),v(r,c),v(r,c+1)].filter(k=>edges[k]).length}function gain(m){const state={...edges,[m.id]:'X'};let g=0;for(const[br,bc]of adj(m.t,m.r,m.c))if(!boxes[b(br,bc)]&&complete(br,bc,state))g++;return g}function cpuPick(){const ms=moves();for(const m of ms)if(gain(m)>0)return m;const safe=ms.filter(m=>!adj(m.t,m.r,m.c).some(([r,c])=>sides(r,c)===2));return safe.length?safe[Math.floor(Math.random()*safe.length)]:ms[Math.floor(Math.random()*ms.length)]}function disable(x){[...svg.querySelectorAll('.hit')].forEach(e=>e.classList.toggle('disabled',x))}function finish(){if(Object.keys(boxes).length!==(n-1)*(n-1))return false;over=true;const s=score();statusMain.textContent=s.O>s.X?'○ の かち！':s.X>s.O?'× の かち！':'ひきわけ！';statusSub.textContent=`○ ${s.O}こ　× ${s.X}こ`;update();disable(true);return true}function place(t,r,c,o){const id=t==='h'?h(r,c):v(r,c);if(edges[id])return 0;edges[id]=o;draw(id);let g=0;for(const[br,bc]of adj(t,r,c)){const k=b(br,bc);if(!boxes[k]&&complete(br,bc)){boxes[k]=o;g++;mark(br,bc,o)}}return g}function after(g){if(finish())return;if(g===0)turn=turn==='O'?'X':'O';if(g>0){statusMain.textContent=`${turn==='O'?'○':'×'} が しかくを ${g}こ とった！`;statusSub.textContent='もう1かい ひけるよ'}else if(mode==='cpu'&&turn==='X'){statusMain.textContent='× が かんがえちゅう…';statusSub.textContent='ちょっと まってね'}else{statusMain.textContent=`${turn==='O'?'○':'×'} の ばんだよ`;statusSub.textContent=mode==='cpu'?'あなたは ○。線を1本 タッチしてね':'点と点の あいだを タッチしてね'}update();if(mode==='cpu'&&turn==='X')cpuTurn()}function choose(t,r,c){if(over||thinking||(mode==='cpu'&&turn==='X'))return;const id=t==='h'?h(r,c):v(r,c);if(edges[id])return;after(place(t,r,c,turn))}function cpuTurn(){thinking=true;disable(true);update();setTimeout(()=>{const m=cpuPick();if(m){const g=place(m.t,m.r,m.c,'X');thinking=false;disable(false);after(g)}},430)}function build(){svg.innerHTML='';edges={};boxes={};turn='O';over=false;thinking=false;for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++)svg.appendChild(E('text',{id:'m-'+b(r,c),x:(pos(c)+pos(c+1))/2,y:(pos(r)+pos(r+1))/2,class:'boxmark'}));for(let r=0;r<n;r++)for(let c=0;c<n-1;c++){const id=h(r,c),y=pos(r),x1=pos(c),x2=pos(c+1);svg.appendChild(E('line',{x1,y1:y,x2,y2:y,class:'guide'}));svg.appendChild(E('line',{id:'l-'+id,x1,y1:y,x2,y2:y,class:'drawn'}));const q=E('line',{x1,y1:y,x2,y2:y,class:'hit'});q.addEventListener('click',()=>choose('h',r,c));svg.appendChild(q)}for(let r=0;r<n-1;r++)for(let c=0;c<n;c++){const id=v(r,c),x=pos(c),y1=pos(r),y2=pos(r+1);svg.appendChild(E('line',{x1:x,y1,x2:x,y2,class:'guide'}));svg.appendChild(E('line',{id:'l-'+id,x1:x,y1,x2:x,y2,class:'drawn'}));const q=E('line',{x1:x,y1,x2:x,y2,class:'hit'});q.addEventListener('click',()=>choose('v',r,c));svg.appendChild(q)}for(let r=0;r<n;r++)for(let c=0;c<n;c++)svg.appendChild(E('circle',{cx:pos(c),cy:pos(r),r:1.45,class:'dot'}));levelNote.textContent=`${n}×${n}の点・しかくは${(n-1)*(n-1)}こ`;statusMain.textContent='○ の ばんだよ';statusSub.textContent=mode==='cpu'?'あなたは ○。線を1本 タッチしてね':'点と点の あいだを タッチしてね';update()}function setMode(m){mode=m;cpuBtn.setAttribute('aria-pressed',String(m==='cpu'));friendBtn.setAttribute('aria-pressed',String(m==='friend'));build()}cpuBtn.addEventListener('click',()=>setMode('cpu'));friendBtn.addEventListener('click',()=>setMode('friend'));levels.forEach(x=>x.addEventListener('click',()=>{n=cfg[Number(x.dataset.level)];levels.forEach(y=>y.setAttribute('aria-pressed',String(y===x)));build()}));restart.addEventListener('click',build);howto.addEventListener('click',()=>rules.classList.toggle('open'));build();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf7e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="点つなぎ陣取り">
<meta name="description" content="iPadやiPhoneで遊べる、ノート風の点つなぎ陣取りゲーム">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>点つなぎ 陣取りゲーム</title>
<style>
:root{--paper:#fbf7e9;--pencil:#4d4a45;--soft:#777066;--rule:#bfd8ec;--margin:#e7b0a6;--panel:rgba(255,252,241,.82);--blue:#6f92bc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e5dc;color:var(--pencil)}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button,a{font:inherit;color:inherit}
.app{min-height:100dvh;max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom)) 46px;position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,var(--rule) 35px,transparent 36px);overflow:hidden}
.app:before{content:"";position:absolute;left:29px;top:0;bottom:0;width:1.5px;background:var(--margin)}.content{position:relative;z-index:1}.back{display:inline-block;text-decoration:none;font-size:14px;font-weight:800;background:rgba(255,255,255,.5);border:1px solid #a59d91;border-radius:999px;padding:8px 12px}
h1{text-align:center;font-size:clamp(27px,7vw,42px);margin:12px 0 2px;letter-spacing:.04em;transform:rotate(-.6deg);text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:4px;text-underline-offset:9px}.sub{text-align:center;font-size:clamp(15px,4vw,20px);font-weight:800;margin:19px 0 0}
.mode-area,.level-area{text-align:center;margin-top:13px}.label{font-size:13px;font-weight:900;color:var(--soft);margin-bottom:6px}.modes,.levels{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.mode,.level,.restart,.howto{min-height:44px;border:1.7px solid #8a8276;background:rgba(255,255,255,.56);border-radius:999px;padding:7px 12px;font-weight:800;box-shadow:1.5px 2px 0 rgba(78,75,70,.13);touch-action:manipulation}.mode[aria-pressed="true"],.level[aria-pressed="true"]{background:#e7edf4;border-color:#71859b}.level-note{margin-top:6px;font-size:12px;color:var(--soft);font-weight:700}
.score{display:flex;justify-content:center;gap:9px;margin:13px auto 0;flex-wrap:wrap}.score span{background:rgba(255,255,255,.62);border:1px solid #d8cfbf;border-radius:10px;padding:7px 12px;font-weight:900}.score .turn{border-width:2px;border-color:#77899c}.board-wrap{width:min(91vw,540px);margin:12px auto 0;position:relative}.board-paper{background:rgba(255,255,255,.18);border-radius:18px;padding:6px}.board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}.guide{stroke:#b7b0a6;stroke-width:1.15;stroke-dasharray:2.2 2.5;opacity:.56}.drawn{stroke:var(--pencil);stroke-width:2.35;stroke-linecap:round;opacity:0}.drawn.show{opacity:.9}.hit{stroke:transparent;stroke-width:9;cursor:pointer;pointer-events:stroke}.disabled-hit{pointer-events:none}.dot{fill:var(--pencil)}.box-mark{fill:var(--pencil);font-size:10px;font-weight:900;text-anchor:middle;dominant-baseline:central;opacity:0;transform-box:fill-box;transform-origin:center}.box-mark.pop{animation:pop .28s ease-out forwards}.last-edge{filter:drop-shadow(0 0 .6px rgba(70,65,60,.4))}
.status{max-width:540px;margin:10px auto 0;text-align:center;background:var(--panel);border:1px solid #d9cfbd;border-radius:13px;padding:9px 12px}.status-main{font-weight:900;font-size:clamp(17px,4.5vw,22px)}.status-sub{font-size:13px;color:var(--soft);font-weight:700;margin-top:2px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:11px}.restart{background:#e7edf3;border-color:#77889b;min-width:145px}.howto{min-width:120px}.rules{display:none;max-width:540px;margin:10px auto 0;background:rgba(255,255,255,.7);border:1px solid #d8cfbf;border-radius:13px;padding:11px 14px;font-size:14px;font-weight:700;line-height:1.7}.rules.open{display:block}.foot{text-align:center;font-size:12px;color:#6d665e;font-weight:700;margin:11px auto 0;line-height:1.6}
@keyframes pop{0%{opacity:0;transform:scale(.45) rotate(-7deg)}70%{opacity:1;transform:scale(1.15) rotate(2deg)}100%{opacity:.86;transform:scale(1) rotate(0)}}
@media(max-width:390px){.app{padding-left:39px;padding-right:8px}.app:before{left:24px}.level,.mode,.score span{font-size:12px;padding-inline:9px}.board-wrap{width:min(94vw,500px)}}
@media(prefers-reduced-motion:reduce){.box-mark.pop{animation:none;opacity:.86}}
</style>
</head>
<body>
<main class="app"><div class="content">
<a class="back" href="../">← もどる</a>
<h1>点つなぎ 陣取りゲーム</h1>
<p class="sub">せんを ひいて、しかくを たくさん とろう！</p>

<section class="mode-area" aria-label="たいせん">
<div class="label">たいせん</div>
<div class="modes">
<button class="mode" id="friendBtn" aria-pressed="false">ふたりで</button>
<button class="mode" id="cpuBtn" aria-pressed="true">コンピューターと</button>
</div>
</section>

<section class="level-area" aria-label="むずかしさ">
<div class="label">むずかしさ</div>
<div class="levels">
<button class="level" data-level="1" aria-pressed="true">① かんたん</button>
<button class="level" data-level="2" aria-pressed="false">② ふつう</button>
<button class="level" data-level="3" aria-pressed="false">③ むずかしい</button>
</div>
<div class="level-note" id="levelNote">4×4の点・しかくは9こ</div>
</section>

<div class="score" aria-label="スコア"><span id="scoreO">○ 0こ</span><span class="turn" id="turnBadge">○ のばん</span><span id="scoreX">× 0こ</span></div>
<div class="board-wrap"><div class="board-paper"><svg class="board" id="board" viewBox="0 0 100 100" role="application" aria-label="点つなぎ陣取りゲーム盤"></svg></div></div>
<section class="status" aria-live="polite"><div class="status-main" id="statusMain">○ の ばんだよ</div><div class="status-sub" id="statusSub">あなたは ○。線を1本 タッチしてね</div></section>
<div class="actions"><button class="restart" id="restart">↻ もういちど</button><button class="howto" id="howto" aria-expanded="false">？ あそびかた</button></div>
<div class="rules" id="rules">① となりの点と点のあいだを1本タッチ。<br>② 4本の線で四角を完成させたら、その四角は自分のもの。<br>③ 四角を取れたら、もう1回つづけて線を引けます。<br>④ 最後に四角をたくさん取った人の勝ち！<br>⑤ 「コンピューターと」では、あなたが ○、コンピューターが × です。</div>
<p class="foot">iPad・iPhoneは指でタッチするだけ。Apple Pencilはなくても遊べます。</p>
</div></main>
<script>
(()=>{
const svg=document.getElementById('board'),statusMain=document.getElementById('statusMain'),statusSub=document.getElementById('statusSub'),scoreO=document.getElementById('scoreO'),scoreX=document.getElementById('scoreX'),turnBadge=document.getElementById('turnBadge'),levelNote=document.getElementById('levelNote');
const levelBtns=[...document.querySelectorAll('.level')],friendBtn=document.getElementById('friendBtn'),cpuBtn=document.getElementById('cpuBtn'),restart=document.getElementById('restart'),howto=document.getElementById('howto'),rules=document.getElementById('rules');
const NS='http://www.w3.org/2000/svg',configs={1:4,2:5,3:6};let n=4,turn='O',edges={},boxes={},gameOver=false,mode='cpu',cpuThinking=false;
const keyH=(r,c)=>`h-${r}-${c}`,keyV=(r,c)=>`v-${r}-${c}`,boxKey=(r,c)=>`b-${r}-${c}`;
function el(name,attrs={}){const x=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));return x}
function coords(){const pad=10,step=80/(n-1);return{pos:i=>pad+i*step}}
function adjacentBoxes(type,r,c){const a=[];if(type==='h'){if(r>0)a.push([r-1,c]);if(r<n-1)a.push([r,c])}else{if(c>0)a.push([r,c-1]);if(c<n-1)a.push([r,c])}return a.filter(([br,bc])=>br>=0&&bc>=0&&br<n-1&&bc<n-1)}
function isComplete(r,c,state=edges){return state[keyH(r,c)]&&state[keyH(r+1,c)]&&state[keyV(r,c)]&&state[keyV(r,c+1)]}
function scores(){let O=0,X=0;Object.values(boxes).forEach(v=>{if(v==='O')O++;if(v==='X')X++});return{O,X}}
function totalBoxes(){return(n-1)*(n-1)}
function updateScore(){const s=scores();scoreO.textContent=`○ ${s.O}こ`;scoreX.textContent=`× ${s.X}こ`;turnBadge.textContent=gameOver?'おしまい':cpuThinking?'× かんがえちゅう':`${turn==='O'?'○':'×'} のばん`}
function drawEdge(id){const line=document.getElementById('line-'+id);if(!line)return;line.classList.add('show','last-edge');const len=line.getTotalLength();line.style.strokeDasharray=len;line.style.strokeDashoffset=len;requestAnimationFrame(()=>{line.style.transition='stroke-dashoffset .34s ease-out';line.style.strokeDashoffset='0'});setTimeout(()=>line.classList.remove('last-edge'),420)}
function markBox(r,c,owner){const t=document.getElementById('mark-'+boxKey(r,c));if(t){t.textContent=owner==='O'?'○':'×';t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}}
function allMoves(){const m=[];for(let r=0;r<n;r++)for(let c=0;c<n-1;c++){const id=keyH(r,c);if(!edges[id])m.push({type:'h',r,c,id})}for(let r=0;r<n-1;r++)for(let c=0;c<n;c++){const id=keyV(r,c);if(!edges[id])m.push({type:'v',r,c,id})}return m}
function countSides(r,c,state=edges){let s=0;if(state[keyH(r,c)])s++;if(state[keyH(r+1,c)])s++;if(state[keyV(r,c)])s++;if(state[keyV(r,c+1)])s++;return s}
function preview(move,owner){const state={...edges,[move.id]:owner};let gained=0;for(const[br,bc]of adjacentBoxes(move.type,move.r,move.c)){const bk=boxKey(br,bc);if(!boxes[bk]&&isComplete(br,bc,state))gained++}return gained}
function risky(move){for(const[br,bc]of adjacentBoxes(move.type,move.r,move.c))if(countSides(br,bc)===2)return true;return false}
function cpuMoveChoice(){const moves=allMoves();if(!moves.length)return null;for(const m of moves)if(preview(m,'X')>0)return m;const safe=moves.filter(m=>!risky(m));if(safe.length)return safe[Math.floor(Math.random()*safe.length)];let best=moves[0],pen=Infinity;for(const m of moves){let p=0;for(const[br,bc]of adjacentBoxes(m.type,m.r,m.c)){const s=countSides(br,bc);if(s===2)p+=3;if(s===3)p+=10}if(p<pen){pen=p;best=m}}return best}
function disableHits(v){[...svg.querySelectorAll('.hit')].forEach(x=>x.classList.toggle('disabled-hit',v))}
function finishIfNeeded(){if(Object.keys(boxes).length!==totalBoxes())return false;gameOver=true;const s=scores();updateScore();statusMain.textContent=s.O>s.X?'○ の かち！':s.X>s.O?'× の かち！':'ひきわけ！';statusSub.textContent=`○ ${s.O}こ　× ${s.X}こ　いい しょうぶ！`;disableHits(true);return true}
function afterMove(gained){if(finishIfNeeded())return;if(gained>0){statusMain.textContent=`${turn==='O'?'○':'×'} が しかくを ${gained}こ とった！`;statusSub.textContent='もう1かい せんを ひけるよ'}else{turn=turn==='O'?'X':'O';if(mode==='cpu'&&turn==='X'){statusMain.textContent='× の ばんだよ';statusSub.textContent='コンピューターが かんがえているよ'}else{statusMain.textContent=`${turn==='O'?'○':'×'} の ばんだよ`;statusSub.textContent=mode==='cpu'?'あなたは ○。線を1本 タッチしてね':'点と点の あいだを タッチしてね'}}updateScore();if(mode==='cpu'&&turn==='X'&&!gameOver)cpuTurn()}
function place(type,r,c,owner){const id=type==='h'?keyH(r,c):keyV(r,c);if(edges[id])return 0;edges[id]=owner;drawEdge(id);let gained=0;for(const[br,bc]of adjacentBoxes(type,r,c)){const bk=boxKey(br,bc);if(!boxes[bk]&&isComplete(br,bc)){boxes[bk]=owner;gained++;markBox(br,bc,owner)}}return gained}
function choose(type,r,c){if(gameOver||cpuThinking||(mode==='cpu'&&turn==='X'))return;const id=type==='h'?keyH(r,c):keyV(r,c);if(edges[id])return;const gained=place(type,r,c,turn);afterMove(gained)}
function cpuTurn(){if(gameOver||mode!=='cpu'||turn!=='X')return;cpuThinking=true;disableHits(true);statusMain.textContent='× が かんがえちゅう…';statusSub.textContent='ちょっと まってね';updateScore();const m=cpuMoveChoice();setTimeout(()=>{if(!m)return;const gained=place(m.type,m.r,m.c,'X');cpuThinking=false;disableHits(false);afterMove(gained)},450)}
function build(){svg.innerHTML='';edges={};boxes={};turn='O';gameOver=false;cpuThinking=false;const{pos}=coords();for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++)svg.appendChild(el('text',{id:'mark-'+boxKey(r,c),x:(pos(c)+pos(c+1))/2,y:(pos(r)+pos(r+1))/2,class:'box-mark'}));for(let r=0;r<n;r++)for(let c=0;c<n-1;c++){const id=keyH(r,c),x1=pos(c),x2=pos(c+1),y=pos(r);svg.appendChild(el('line',{x1,y1:y,x2,y2:y,class:'guide'}));svg.appendChild(el('line',{id:'line-'+id,x1,y1:y,x2,y2:y,class:'drawn'}));const hit=el('line',{x1,y1:y,x2,y2:y,class:'hit'});hit.addEventListener('click',()=>choose('h',r,c));svg.appendChild(hit)}for(let r=0;r<n-1;r++)for(let c=0;c<n;c++){const id=keyV(r,c),x=pos(c),y1=pos(r),y2=pos(r+1);svg.appendChild(el('line',{x1:x,y1,x2:x,y2,class:'guide'}));svg.appendChild(el('line',{id:'line-'+id,x1:x,y1,x2:x,y2,class:'drawn'}));const hit=el('line',{x1:x,y1,x2:x,y2,class:'hit'});hit.addEventListener('click',()=>choose('v',r,c));svg.appendChild(hit)}for(let r=0;r<n;r++)for(let c=0;c<n;c++)svg.appendChild(el('circle',{cx:pos(c),cy:pos(r),r:1.45,class:'dot'}));statusMain.textContent='○ の ばんだよ';statusSub.textContent=mode==='cpu'?'あなたは ○。線を1本 タッチしてね':'点と点の あいだを タッチしてね';levelNote.textContent=`${n}×${n}の点・しかくは${totalBoxes()}こ`;updateScore()}
function setLevel(l){n=configs[l];levelBtns.forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===l)));build()}
function setMode(m){mode=m;friendBtn.setAttribute('aria-pressed',String(m==='friend'));cpuBtn.setAttribute('aria-pressed',String(m==='cpu'));build()}
levelBtns.forEach(b=>b.addEventListener('click',()=>setLevel(Number(b.dataset.level))));friendBtn.addEventListener('click',()=>setMode('friend'));cpuBtn.addEventListener('click',()=>setMode('cpu'));restart.addEventListener('click',build);howto.addEventListener('click',()=>{const open=!rules.classList.contains('open');rules.classList.toggle('open',open);howto.setAttribute('aria-expanded',String(open))});build();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script>
</body></html>

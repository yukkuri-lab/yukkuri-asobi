<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7e9">
  <title>○×ゲーム やろうよ！</title>
  <style>
    :root{--paper:#fbf7e9;--pencil:#4d4a45;--rule:#bfd8ec;--margin:#e7b0a6;--blue:#6f92bc}
    *{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:var(--pencil);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
    main{min-height:100vh;max-width:760px;margin:auto;padding:34px 22px 60px 52px;position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,var(--rule) 35px,transparent 36px)}
    main:before{content:"";position:absolute;left:31px;top:0;bottom:0;width:1.5px;background:var(--margin)}
    .inner{position:relative}.title{text-align:center;font-size:clamp(30px,7vw,46px);margin:8px 0 10px;letter-spacing:.06em;transform:rotate(-.6deg)}
    .sub{text-align:center;font-weight:700;color:#6a645d;margin-bottom:34px}.card{display:block;text-decoration:none;color:inherit;max-width:520px;margin:0 auto;background:rgba(255,255,255,.55);border:2px solid #8b8377;border-radius:18px;padding:22px;box-shadow:2px 3px 0 rgba(70,65,60,.15);transform:rotate(.2deg)}
    .game-title{font-size:28px;font-weight:900;margin:0 0 9px}.board{width:150px;aspect-ratio:1;margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);position:relative}.board:before,.board:after{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--pencil)}.board:before{left:33%}.board:after{left:66%}.h{position:absolute;left:0;right:0;height:3px;background:var(--pencil)}.h1{top:33%}.h2{top:66%}.cell{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800}.cta{text-align:center;margin-top:15px;font-weight:900;color:#476d98}.note{text-align:center;margin:32px auto 0;max-width:560px;font-size:14px;line-height:1.8;color:#625d56}
    @media(max-width:390px){main{padding-left:40px;padding-right:12px}main:before{left:25px}.card{padding:18px}}
  </style>
</head>
<body>
<main>
  <div class="inner">
    <h1 class="title">○×ゲーム やろうよ！</h1>
    <p class="sub">ノートにえんぴつで書いたみたいな、○×ゲーム</p>
    <a class="card" href="./marubatsu/" aria-label="ノートで○×ゲームをあそぶ">
      <h2 class="game-title">ノートで ○×ゲーム</h2>
      <p>学校で友だちと遊ぶような、シンプルな○×ゲームです。ふたりでも、コンピューターとも遊べます。</p>
      <div class="board" aria-hidden="true">
        <span class="h h1"></span><span class="h h2"></span>
        <span class="cell">○</span><span class="cell"></span><span class="cell">×</span>
        <span class="cell"></span><span class="cell">○</span><span class="cell"></span>
        <span class="cell">×</span><span class="cell"></span><span class="cell"></span>
      </div>
      <div class="cta">▶ ゲームをはじめる</div>
    </a>
    <p class="note">学校でも、おうちでも。友だちや家族といっしょに遊んでね。</p>
  </div>
</main>
</body>
</html>

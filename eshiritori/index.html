<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf7e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="絵しりとり">
<meta name="description" content="iPadやiPhoneで指で描いて遊べる、ノート風の絵しりとり">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>絵しりとり</title>
<style>
:root{--paper:#fbf7e9;--pencil:#4d4a45;--soft:#716b63;--rule:#bfd8ec;--margin:#e7b0a6;--blue:#6f92bc;--panel:rgba(255,252,241,.82)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e5dc;color:var(--pencil)}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button,a{font:inherit;color:inherit}
.app{min-height:100dvh;max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom)) 46px;position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,var(--rule) 35px,transparent 36px)}.app:before{content:"";position:absolute;left:29px;top:0;bottom:0;width:1.5px;background:var(--margin)}.content{position:relative;z-index:1}.back{display:inline-block;text-decoration:none;font-size:14px;font-weight:800;background:rgba(255,255,255,.5);border:1px solid #a59d91;border-radius:999px;padding:8px 12px}
h1{text-align:center;font-size:clamp(29px,8vw,43px);margin:12px 0 3px;letter-spacing:.05em;transform:rotate(-.5deg);text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:4px;text-underline-offset:9px}.sub{text-align:center;font-size:clamp(15px,4vw,20px);font-weight:800;margin:18px 0 0}.mode-area,.level-area{text-align:center;margin-top:13px}.label{font-size:13px;font-weight:900;color:var(--soft);margin-bottom:6px}.modes,.levels{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.mode,.level,.tool,.next,.restart,.howto{min-height:44px;border:1.7px solid #8a8276;background:rgba(255,255,255,.57);border-radius:999px;padding:7px 12px;font-weight:800;box-shadow:1.5px 2px 0 rgba(78,75,70,.13);touch-action:manipulation}.mode[aria-pressed="true"],.level[aria-pressed="true"]{background:#e7edf4;border-color:#71859b}.level-note{margin-top:6px;font-size:12px;color:var(--soft);font-weight:700}
.prompt{max-width:560px;margin:13px auto 0;background:var(--panel);border:1px solid #d9cfbd;border-radius:14px;padding:10px 12px;text-align:center}.prompt-main{font-size:clamp(18px,5vw,24px);font-weight:900}.prompt-sub{margin-top:3px;font-size:13px;color:var(--soft);font-weight:700}.emoji{font-size:34px;vertical-align:middle;margin-right:5px}.step{display:inline-block;margin-left:7px;font-size:13px;background:rgba(255,255,255,.65);border:1px solid #d5ccbc;border-radius:999px;padding:3px 8px}
.pad-wrap{width:min(91vw,560px);margin:12px auto 0}.pad{position:relative;background:rgba(255,255,255,.45);border:2px solid #8b8377;border-radius:18px;overflow:hidden;box-shadow:2px 3px 0 rgba(70,65,60,.12)}canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;background:rgba(255,255,255,.35)}.corner{position:absolute;left:10px;top:8px;font-size:13px;font-weight:900;color:#8a8378;pointer-events:none}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.tool{min-width:92px}.next{background:#e7edf3;border-color:#71859b;min-width:145px}.thumb-title{text-align:center;margin-top:15px;font-size:13px;color:var(--soft);font-weight:900}.thumbs{display:flex;gap:8px;max-width:560px;margin:7px auto 0;overflow-x:auto;padding:3px 2px 8px}.thumb{flex:0 0 88px;background:rgba(255,255,255,.55);border:1.5px solid #9b9387;border-radius:10px;padding:4px;text-align:center}.thumb canvas{width:78px;height:58px;aspect-ratio:auto;border-radius:6px}.thumb span{display:block;font-size:11px;font-weight:800;margin-top:3px;color:var(--soft)}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:11px}.restart{background:#f1eee7}.rules{display:none;max-width:560px;margin:10px auto 0;background:rgba(255,255,255,.72);border:1px solid #d8cfbf;border-radius:13px;padding:11px 14px;font-size:14px;font-weight:700;line-height:1.75}.rules.open{display:block}.foot{text-align:center;max-width:560px;margin:11px auto 0;font-size:12px;color:#6d665e;font-weight:700;line-height:1.6}
@media(max-width:390px){.app{padding-left:39px;padding-right:8px}.app:before{left:24px}.mode,.level,.tool,.next{font-size:12px;padding-inline:10px}.thumb{flex-basis:78px}.thumb canvas{width:68px;height:51px}}
</style>
</head>
<body>
<main class="app"><div class="content">
<a class="back" href="../">← もどる</a>
<h1>絵しりとり</h1>
<p class="sub">もじは かかずに、えだけで つなげよう！</p>
<section class="mode-area"><div class="label">あそびかた</div><div class="modes"><button class="mode" id="soloBtn" aria-pressed="true">ひとりで れんしゅう</button><button class="mode" id="friendBtn" aria-pressed="false">おともだちと</button></div></section>
<section class="level-area"><div class="label">ながさ</div><div class="levels"><button class="level" data-count="4" aria-pressed="true">① 4こ</button><button class="level" data-count="6" aria-pressed="false">② 6こ</button><button class="level" data-count="8" aria-pressed="false">③ 8こ</button></div><div class="level-note" id="levelNote">4この絵をつなげよう</div></section>
<section class="prompt" aria-live="polite"><div class="prompt-main" id="promptMain"></div><div class="prompt-sub" id="promptSub"></div></section>
<div class="pad-wrap"><div class="pad"><canvas id="drawCanvas" width="800" height="600" aria-label="絵を描くところ"></canvas><div class="corner" id="corner">1こめ</div></div></div>
<div class="tools"><button class="tool" id="undoBtn">↶ 1つもどす</button><button class="tool" id="clearBtn">けす</button><button class="next" id="nextBtn">できた！ つぎへ →</button></div>
<div class="thumb-title">いままでの え</div><div class="thumbs" id="thumbs"></div>
<div class="actions"><button class="restart" id="restartBtn">↻ はじめから</button><button class="howto" id="howtoBtn">？ あそびかた</button></div>
<div class="rules" id="rules">① さいしょのお題を見よう。<br>② さいごの音からはじまるものを、文字を使わず絵でかこう。<br>③ 「できた！ つぎへ」を押したら、次の人・次の絵へ。<br>④ 前の絵が何か考えて、しりとりをつづけよう。<br>⑤ 「ん」で終わるものを描いたらおしまい！</div>
<p class="foot" id="foot">iPad・iPhoneは指でそのまま描けます。Apple Pencilでも描けます。</p>
</div></main>
<script>
(()=>{
const canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d'),soloBtn=document.getElementById('soloBtn'),friendBtn=document.getElementById('friendBtn'),levels=[...document.querySelectorAll('.level')],levelNote=document.getElementById('levelNote'),promptMain=document.getElementById('promptMain'),promptSub=document.getElementById('promptSub'),corner=document.getElementById('corner'),thumbs=document.getElementById('thumbs'),undoBtn=document.getElementById('undoBtn'),clearBtn=document.getElementById('clearBtn'),nextBtn=document.getElementById('nextBtn'),restartBtn=document.getElementById('restartBtn'),howtoBtn=document.getElementById('howtoBtn'),rules=document.getElementById('rules'),foot=document.getElementById('foot');
const starters=[['🍎','りんご','ご'],['🐼','ぱんだ','だ'],['🐘','ぞう','う'],['🐱','ねこ','こ'],['🍌','ばなな','な'],['🚗','くるま','ま'],['🐟','さかな','な'],['🍅','とまと','と'],['🐰','うさぎ','ぎ'],['🦍','ごりら','ら']];
let mode='solo',maxCount=4,index=0,start=starters[0],drawing=false,last=null,strokes=[],snapshots=[];
ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#4d4a45';ctx.lineWidth=7;
function pickStarter(){start=starters[Math.floor(Math.random()*starters.length)]}
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function saveState(){strokes.push(canvas.toDataURL());if(strokes.length>30)strokes.shift()}
function restore(src){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function startDraw(e){drawing=true;last=pointerPos(e);saveState();canvas.setPointerCapture?.(e.pointerId)}
function moveDraw(e){if(!drawing)return;const p=pointerPos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}
function endDraw(e){drawing=false;last=null;try{canvas.releasePointerCapture?.(e.pointerId)}catch(_){}}
canvas.addEventListener('pointerdown',startDraw);canvas.addEventListener('pointermove',moveDraw);canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);
function clearPad(){ctx.clearRect(0,0,canvas.width,canvas.height);strokes=[]}
function updatePrompt(){corner.textContent=`${index+1}こめ`;if(index===0){promptMain.innerHTML=`さいしょは <span class="emoji">${start[0]}</span>「${start[1]}」 <span class="step">${index+1}/${maxCount}</span>`;promptSub.textContent=`「${start[2]}」から はじまるものを えでかいてね`;}else{promptMain.innerHTML=`つぎの えを かこう！ <span class="step">${index+1}/${maxCount}</span>`;promptSub.textContent=mode==='solo'?'まえの絵の さいごの音から、つづけてみよう':'まえの絵がなにか考えて、しりとりでつづけよう';}nextBtn.textContent=index===maxCount-1?'できた！ おしまい':'できた！ つぎへ →';foot.textContent=mode==='solo'?'ひとりで何個つなげられるか練習してみよう。':'おともだちと交代で、前の絵を見ながらつなげよう。';}
function addThumb(data,n){const wrap=document.createElement('div');wrap.className='thumb';const c=document.createElement('canvas');c.width=156;c.height=116;const t=c.getContext('2d');const im=new Image();im.onload=()=>t.drawImage(im,0,0,c.width,c.height);im.src=data;const s=document.createElement('span');s.textContent=`${n}こめ`;wrap.append(c,s);thumbs.appendChild(wrap);wrap.scrollIntoView({behavior:'smooth',inline:'end',block:'nearest'})}
function finishGame(){promptMain.textContent='できた！ 絵しりとり かんせい！';promptSub.textContent=`${maxCount}この絵が つながったよ`;nextBtn.disabled=true;nextBtn.textContent='かんせい！';}
function next(){const data=canvas.toDataURL();addThumb(data,index+1);snapshots.push(data);if(index>=maxCount-1){finishGame();return}index++;clearPad();updatePrompt()}
function restartGame(){index=0;snapshots=[];thumbs.innerHTML='';nextBtn.disabled=false;pickStarter();clearPad();updatePrompt()}
undoBtn.addEventListener('click',()=>{const prev=strokes.pop();if(prev)restore(prev)});clearBtn.addEventListener('click',()=>{saveState();ctx.clearRect(0,0,canvas.width,canvas.height)});nextBtn.addEventListener('click',next);restartBtn.addEventListener('click',restartGame);howtoBtn.addEventListener('click',()=>rules.classList.toggle('open'));
function setMode(m){mode=m;soloBtn.setAttribute('aria-pressed',String(m==='solo'));friendBtn.setAttribute('aria-pressed',String(m==='friend'));restartGame()}
soloBtn.addEventListener('click',()=>setMode('solo'));friendBtn.addEventListener('click',()=>setMode('friend'));
levels.forEach(b=>b.addEventListener('click',()=>{maxCount=Number(b.dataset.count);levels.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));levelNote.textContent=`${maxCount}この絵をつなげよう`;restartGame()}));
pickStarter();updatePrompt();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script>
</body></html>

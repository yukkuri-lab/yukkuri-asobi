<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ようかいごはん">
<title>ようかい ごはん</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --paper:#FBF7E9;--pencil:#4D4A45;--soft:#686159;--rule:#BFD8EC;--margin:#E7B0A6;
  --blue:#6F92BC;--pick-bg:#E8EEF5;--pick-border:#6F8195;--panel-border:#D9CFBD;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--pencil)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
main{min-height:100dvh;max-width:760px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom)) 48px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--rule) 39px,var(--rule) 40px)}
main:before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin)}
#app{position:relative}
h1{font-size:clamp(27px,7vw,42px);font-weight:900;margin:0;letter-spacing:.04em;text-align:center}
h1:focus,.q:focus{outline:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{font-size:14px;border:2px solid var(--panel-border);border-radius:999px;padding:8px 12px;white-space:nowrap;background:var(--paper)}
.q{font-size:24px;font-weight:900;margin:20px 0 12px;line-height:1.6}
.hint{font-size:16px;color:var(--soft);margin:0 0 12px;line-height:1.7}
.center{text-align:center}

/* ボタン */
.card,.btn,.area,.tile,.mon{font:inherit;color:var(--pencil);background:var(--paper);cursor:pointer;touch-action:manipulation;transition:transform .08s,background .15s}
.card:hover,.btn:hover,.area:hover,.tile:hover,.mon:hover{background:var(--pick-bg)}
.card:active,.btn:active,.area:active,.tile:active,.mon:active{transform:translateY(2px) scale(.98)}
.card:focus-visible,.btn:focus-visible,.area:focus-visible,.tile:focus-visible,.mon:focus-visible,.link:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid.one{grid-template-columns:1fr}
@media(min-width:640px){.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{font-size:24px;font-weight:900;border:2px solid var(--soft);border-radius:13px;min-height:88px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.4;box-shadow:0 3px 0 var(--panel-border)}
.card.small{font-size:16px;min-height:64px}
.card .face{font-size:48px;line-height:1}
.btn{font-size:16px;font-weight:900;border:2px solid var(--soft);border-radius:999px;min-height:48px;padding:12px 20px}
.btn.main{background:var(--pick-bg);border-color:var(--pick-border);font-size:24px;min-height:64px;padding:12px 40px;box-shadow:0 4px 0 var(--pick-border)}
.btn.main:hover{background:var(--paper)}
.btn.wide{width:100%}
.link{font:inherit;font-size:14px;font-weight:700;color:var(--soft);background:none;border:none;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.link:hover{color:var(--pencil)}
.link:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.row.mid{justify-content:center}

/* ようかい */
.stage{display:flex;align-items:flex-end;gap:12px;margin:12px 0}
.stage.big{flex-direction:column;align-items:center;margin:20px 0}
.ykw{flex:none;width:120px;height:120px;display:flex;align-items:flex-end;justify-content:center}
.stage.big .ykw{width:min(100%,260px);height:240px}
.yk{max-width:100%;max-height:100%;object-fit:contain;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.yk.shadow{filter:brightness(0) opacity(.85)}
.yk.half{filter:brightness(.45) saturate(.4)}
.yk.eat{animation:chomp .22s ease-in-out 5}
.yk.reveal{animation:reveal .9s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes chomp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
@keyframes reveal{0%{transform:scale(.6) rotate(-8deg);filter:brightness(3)}60%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1)}}
.bubble{position:relative;flex:1;min-width:0;font-size:16px;line-height:1.7;background:var(--paper);border:2px solid var(--pick-border);border-radius:13px;padding:12px;margin-bottom:20px}
.bubble:after{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--pick-border);border-bottom:2px solid var(--pick-border);transform:rotate(45deg)}
.stage.big .bubble{margin:12px 0 0;width:100%;text-align:center;font-size:24px;font-weight:900}
.stage.big .bubble:after{left:50%;top:-10px;bottom:auto;margin-left:-8px;transform:rotate(135deg)}
.say{flex:none;font:inherit;font-size:16px;background:none;border:2px solid var(--panel-border);border-radius:999px;width:40px;height:40px;cursor:pointer;margin-left:8px;vertical-align:middle}
.say:hover{background:var(--pick-bg)}
.say:active{transform:scale(.95)}
.say:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* おだい */
.odai{border:2px solid var(--pick-border);border-radius:13px;padding:12px 20px;background:var(--pick-bg);margin:0 0 12px;animation:flip .45s ease-out}
.odai.still{animation:none}
.odai-label{font-size:13px}
.odai-text{font-size:24px;font-weight:900;line-height:1.6;margin:0}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ごはんの文 */
.bowl{font-size:24px;font-weight:900;line-height:2.1;margin:12px 0;padding:12px 20px;border:2px solid var(--panel-border);border-radius:13px;background:var(--paper)}
.bowl p{margin:0}
.r-act{border-bottom:4px solid var(--blue)}
.r-feel{border-bottom:4px solid var(--margin)}
.r-why{border-bottom:4px dashed var(--pick-border)}
.r-next{border-bottom:4px dotted var(--blue)}
.slot{display:inline-block;min-width:3em;padding:0 8px;border:2px dashed var(--soft);border-radius:10px;color:var(--soft);font-size:16px;line-height:1.8;text-align:center;vertical-align:middle}
.slot.cur{border-style:solid;border-color:var(--pick-border);background:var(--pick-bg);color:var(--pencil)}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

/* ならべる */
.slots{display:grid;gap:8px;margin:12px 0}
.lineslot{min-height:56px;border:2px dashed var(--soft);border-radius:13px;padding:12px;font-size:16px;display:flex;align-items:center;gap:8px}
.lineslot b{flex:none;width:32px;height:32px;border-radius:999px;border:2px solid var(--pick-border);display:flex;align-items:center;justify-content:center}
.lineslot.filled{border-style:solid;border-color:var(--pick-border);background:var(--pick-bg)}
.tiles{display:grid;gap:12px}
.tile{font-size:16px;font-weight:900;border:2px solid var(--soft);border-radius:13px;padding:12px;text-align:left;line-height:1.6;min-height:56px;box-shadow:0 3px 0 var(--panel-border)}
.shake{animation:shake .35s;border-color:var(--margin)!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* かく */
.pad{position:relative;width:min(100%,700px);height:200px;border:2px solid var(--pick-border);border-radius:13px;overflow:hidden;
  background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 99px,var(--rule) 99px,var(--rule) 100px)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.guide{font-size:24px;font-weight:900;line-height:1.7;margin:12px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}
.dot{width:14px;height:14px;border-radius:999px;border:2px solid var(--pick-border)}
.dot.on{background:var(--blue);border-color:var(--blue)}

/* けっか */
.got{font-size:24px;font-weight:900;margin:12px 0;text-align:center}
.meter{display:flex;gap:8px;justify-content:center;margin:12px 0}
.meter span{width:40px;height:40px;border-radius:999px;border:2px solid var(--pick-border);display:flex;align-items:center;justify-content:center;font-size:24px}
.meter span.on{background:var(--pick-bg)}

/* マップ */
.hero{border:2px solid var(--pick-border);background:var(--pick-bg);border-radius:13px;padding:12px 20px;display:flex;align-items:center;gap:12px;margin:20px 0 12px}
.hero .ykw{width:96px;height:96px}
.hero-text{flex:1;min-width:0}
.hero-text .q{margin:0 0 8px}
.areas{display:grid;gap:12px}
.area{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--soft);border-radius:13px;padding:12px;box-shadow:0 3px 0 var(--panel-border)}
.area.lock{border-style:dashed;box-shadow:none;cursor:default}
.area.lock:hover{background:var(--paper)}
.area.lock:active{transform:none}
.area-icon{flex:none;font-size:40px;width:56px;text-align:center}
.area-text{flex:1;min-width:0}
.area-name{display:block;font-size:16px;font-weight:900;line-height:1.5}
.area-desc{display:block;font-size:14px;color:var(--soft);line-height:1.5}
.mini{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.mini img{width:28px;height:28px;object-fit:contain}
.mini img.shadow{filter:brightness(0) opacity(.6)}

/* ずかん */
.zukan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 20px}
@media(min-width:640px){.zukan{grid-template-columns:repeat(5,minmax(0,1fr))}}
.mon{border:2px solid var(--soft);border-radius:13px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mon img{width:100%;height:80px;object-fit:contain}
.mon img.shadow{filter:brightness(0) opacity(.6)}
.mon .name{font-size:13px;line-height:1.4}
.mon.lock{border-style:dashed;cursor:default}
.mon.lock:hover{background:var(--paper)}
.zukan-h{font-size:16px;margin:20px 0 0}

details{margin-top:40px;font-size:14px;color:var(--soft);line-height:1.8}
summary{cursor:pointer;padding:8px 0}
summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

@media(max-width:390px){
  main{padding-left:40px;padding-right:12px}main:before{left:24px}
  .card{font-size:16px;min-height:72px}.card .face{font-size:40px}
  .bowl,.odai-text,.guide{font-size:16px}.bowl{padding:12px}
  .ykw{width:88px;height:88px}
  .btn.main{padding:12px 20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  {w:'くやしかった', f:'😤', s:'くやしかったです', p:'が', more:1, r:['まちがえて しまった','まけて しまった','おもったように できなかった','じかんが たりなかった'], x:['れんしゅうして つぎは できるように したいです','あきらめないで やりたいです','もう いちど ちょうせんしたいです']},
  {w:'ドキドキした', f:'😳', s:'ドキドキしました', p:'に', more:1, r:['みんなの まえで やった','はじめて やった','うまく いくか しんぱいだった','どうなるか わからなかった'], x:['つぎは おちついて やりたいです','じしんを もって やりたいです','また ちょうせんしたいです']},
  {w:'もっと しりたい',f:'🤔', s:'もっと しりたいと おもいました', more:1, r:['ふしぎだった','おもしろかった','つづきが きになった','ほかにも ありそうだった'], x:['としょかんで しらべたいです','せんせいに しつもんしたいです','おうちで しらべたいです']},
  {w:'できるように なった',f:'💪', s:'できるように なって うれしかったです', more:1, r:['れんしゅうした','なんかいも やってみた','せんせいに おしえて もらった','こつが わかった'], x:['もっと むずかしい ことにも ちょうせんしたいです','わすれないように また やりたいです','ともだちにも おしえたいです']},
];
const YUM = ['うまっ！','もぐもぐ… げっぷ〜！','ほっぺが おちそう！','もう いっこ ちょうだい！','しあわせ〜！','これは ごちそうだ！'];
const NOPE = ['それは まだ たべられないよ〜','ちがう ちがう〜！','うーん、じゅんばんが ちがうかも'];

/* ================= きろく（この たんまつの なかだけ） ================= */
const KEY='yokai-gohan-v1';
const fresh=()=>({fed:{}, plays:0, days:[], feel:{}});
let S; try{ S=JSON.parse(localStorage.getItem(KEY))||fresh() }catch(e){ S=fresh() }
if(!S.fed) S=fresh();
const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){} };
const need = code => (code==='F001') ? 1 : 2;          // さいしょの 1ぴきは 1かいで しょうたいが わかる
const met = code => (S.fed[code]||0) >= need(code);
const metIn = i => AREAS[i].yk.filter(met).length;
const areaOpen = i => i===0 || metIn(i-1) >= OPEN_NEXT;
const totalMet = () => Object.keys(YOKAI).filter(met).length;
const today=(d=new Date())=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function streak(){ let n=0; const d=new Date(); if(!S.days.includes(today(d))) d.setDate(d.getDate()-1); while(S.days.includes(today(d))){ n++; d.setDate(d.getDate()-1) } return n }
function lookState(code){ const n=S.fed[code]||0; return n>=need(code)?'':(n>0?'half':'shadow') }
const img = (code,cls='') => `<img class="yk ${cls}" src="./img/${code}.webp" alt="" draggable="false">`;

/* ================= べんり ================= */
const app=document.getElementById('app');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
const one=a=>a[Math.floor(Math.random()*a.length)];
function show(html){ app.innerHTML=html; window.scrollTo({top:0}); const q=app.querySelector('.q,h1'); if(q){ q.setAttribute('tabindex','-1'); q.focus({preventScroll:true}) } }
function on(sel,fn){ app.querySelectorAll(sel).forEach(el=>el.addEventListener('click',fn)) }

// こえ（ようかいは すこし たかい こえ）
let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith('ja')); voice=vs.find(v=>/Kyoko|O-ren|Google/.test(v.name))||vs[0]||null }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice }
function playbackMode(){ try{ if(navigator.audioSession&&navigator.audioSession.type!=='playback') navigator.audioSession.type='playback' }catch(e){} }
function speak(text,yokai=true){
  playbackMode();
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/[ 　]/g,''));
  u.lang='ja-JP'; u.rate=yokai?.95:.85; u.pitch=yokai?1.45:1; if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}
const hush=()=>{ if(window.speechSynthesis) speechSynthesis.cancel() };

// こうかおん
let ac=null;
function sfx(kind){
  playbackMode();
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    const tone=(f,st,d,type='sine',v=.18)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+st); g.gain.setValueAtTime(v,t+st); g.gain.exponentialRampToValueAtTime(.001,t+st+d); o.connect(g).connect(ac.destination); o.start(t+st); o.stop(t+st+d) };
    if(kind==='tap') tone(660,0,.08,'triangle',.12);
    if(kind==='no') { tone(300,0,.12,'square',.08); tone(220,.12,.16,'square',.08) }
    if(kind==='chomp') for(let i=0;i<5;i++) tone(140+Math.random()*60,i*.22,.12,'sawtooth',.12);
    if(kind==='yay') [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.18));
    if(kind==='step') tone(880,0,.1,'triangle',.12);
  }catch(e){}
}

}
function bindSay(text){ on('#sayBtn',()=>speak(text)) }
function setSay(text){ const s=app.querySelector('#say'); if(s) s.textContent=text; const b=app.querySelector('#sayBtn'); if(b) b.onclick=()=>speak(text); speak(text) }

/* ================= ホーム ================= */
function currentArea(){ let a=0; for(let i=0;i<AREAS.length;i++) if(areaOpen(i)) a=i; return a }
function nextYokai(ai){
  const list=AREAS[ai].yk;
  return list.find(c=>(S.fed[c]||0)>0 && !met(c)) || list.find(c=>!met(c)) || one(list);
}
function home(){

        <span class="area-desc">${open?esc(a.desc):`まえの ばしょで あと ${OPEN_NEXT-metIn(i-1)}ぴき あうと ひらくよ`}</span>
        ${open?`<span class="mini">${a.yk.map(c=>`<img class="${met(c)?'':'shadow'}" src="./img/${c}.webp" alt="">`).join('')}</span>`:''}</span></button>`;
    }).join('')}</div>
    <div class="row"><button class="btn" id="zukan" type="button">📖 ようかいずかん</button></div>
    <details><summary>おうちの人へ</summary>

      <p>場所（もり→まち）が進むごとにヒントが減り、最後の「まち」では授業と同じように自分で書きます。まちがえても何も減りません。速さも競いません。</p>
      <p>「きょうの じゅぎょうで やる」を選ぶと、その日の本当の授業で練習できます。記録はこの端末の中だけに残ります。</p>

/* ================= 1かいの あそび ================= */
let P=null, lastOdai=-1;
function startPlay(ai){
  P={ai, mech:AREAS[ai].mech, code:nextYokai(ai), ctx:null, act:null, feel:null, detail:null, why:null, next:null, form:ai};
  const hello = met(P.code) ? `${YOKAI[P.code]}だよ。おなか すいた〜！ きょうの はなし、きかせて！` : 'おなか すいた〜！ きょうの はなし、きかせて！';
  show(`${topBar()}${stageHTML(P.code,hello,true)}
    <div class="row mid"><button class="btn main" id="draw" type="button">🃏 おだいカードを ひく</button></div>
    <div class="row mid"><button class="link" id="real" type="button">きょうの じゅぎょうで やる</button></div>`);
  bindSay(hello); speak(hello);
  on('#draw',()=>{ sfx('step'); P.ctx=drawOdai(); begin() });
  on('#real',()=>{ sfx('tap'); pickSubject() });
}
function topBar(){ return `<div class="top"><button class="link" id="home" type="button">← もどる</button><span class="pill">${AREAS[P.ai].icon} ${esc(AREAS[P.ai].name)}</span></div>` }
function bindTop(){ on('#home',()=>{ hush(); home() }) }
function drawOdai(){ let i; do{ i=Math.floor(Math.random()*ODAI.length) }while(i===lastOdai); lastOdai=i; const o=ODAI[i]; return {s:o.s,a:o.a,d:o.d,odai:true} }
function odaiHTML(){ const f=P.flipped?' still':''; P.flipped=true; return `<div class="odai${f}"><div class="odai-label">${P.ctx.odai?'🃏 おだいカード':'🏫 きょうの じゅぎょう'}</div><p class="odai-text">${esc(when(P.ctx.s))} ${esc(P.ctx.a)}。</p></div>` }
function pickSubject(){
  const items=Object.keys(SUBJECTS), t='きょうは なんの じかんの はなし？';
  show(`${topBar()}${stageHTML(P.code,t)}<div class="grid four">${items.map((s,i)=>`<button class="card small" type="button" data-i="${i}">${esc(s)}</button>`).join('')}</div>`);
  bindTop(); bindSay(t); speak(t);
  on('.card',e=>{ sfx('tap'); P.ctx={s:items[+e.currentTarget.dataset.i],a:null,d:pick(REAL_DETAILS,3),odai:false}; pickAction() });
}
function pickAction(){
  const items=SUBJECTS[P.ctx.s], t=`${P.ctx.s}で なにを した？`;
  show(`${topBar()}${stageHTML(P.code,t)}<div class="grid">${items.map((a,i)=>`<button class="card small" type="button" data-i="${i}">${esc(a)}</button>`).join('')}</div>`);
  bindTop(); bindSay(t); speak(t);
  on('.card',e=>{ sfx('tap'); P.ctx.a=items[+e.currentTarget.dataset.i]; begin() });
}
function begin(){
  // じゅぎょうモードと もり・そうげん は「したこと」が きまっている。みずうみ から おだいの ときは じぶんで えらぶ
  P.act = (!P.ctx.odai || P.ai<=1) ? P.ctx.a : null;
  ({erabu:erabu, narabe:narabe, anaume:fill, kondo:fill, dokoga:fill, koe:koe, kaku:kaku})[P.mech]();
}
const hasNext=f=>f>=3, hasDetail=f=>f===4;
const when=s=>s.endsWith('じかん')?`${s}に`:`${s}の じかんに`; // 「やすみじかんの じかんに」に しない
function lines(){
  const L=[{r:'act',t:`きょうは、${when(P.ctx.s)} ${P.act}。`},
    {r:'feel',t:P.detail?`${P.detail}${P.feel.p} ${P.feel.s}。`:`${P.feel.s}。`},
    {r:'why',t:`なぜかと いうと、${P.why}からです。`}];
  if(P.next) L.push({r:'next',t:`こんどは、${P.next}。`});
  return L;
}
const bowlHTML=L=>`<div class="bowl">${L.map(l=>`<p><span class="r-${l.r}">${esc(l.t)}</span></p>`).join('')}</div>`;

/* ---- もり：えらぶ ---- */
function erabu(more=false){
  const list=FEELINGS.filter(f=>more||!f.more), t='どんな きもち だった？';
  show(`${topBar()}${stageHTML(P.code,t)}${odaiHTML()}
    <div class="grid four">${list.map((f,i)=>`<button class="card" type="button" data-i="${i}"><span class="face" aria-hidden="true">${f.f}</span>${esc(f.w)}</button>`).join('')}</div>
    ${more?'':'<div class="row"><button class="btn" id="more" type="button">ほかの きもち</button></div>'}`);
  bindTop(); bindSay(t); if(!more) speak(t);
  on('.card',e=>{ sfx('tap'); P.feel=list[+e.currentTarget.dataset.i]; erabuWhy() });
  on('#more',()=>{ sfx('tap'); erabu(true) });
}
function erabuWhy(){
  const t=`どうして「${P.feel.w}」と おもった？`;
  show(`${topBar()}${stageHTML(P.code,t)}${odaiHTML()}
    <div class="grid">${P.feel.r.map((r,i)=>`<button class="card small" type="button" data-i="${i}">${esc(r)}から</button>`).join('')}</div>`);
  bindTop(); bindSay(t); speak(t);
  on('.card',e=>{ sfx('tap'); P.why=P.feel.r[+e.currentTarget.dataset.i]; serve() });
}

/* ---- そうげん：ならべる ---- */
function narabe(){
  P.feel=one(FEELINGS.filter(f=>!f.more)); P.why=P.feel.r[0]; // どの おだいにも あう わけ
  const L=lines(), order=pick([0,1,2],3), COACH=['さいしょは「きょうは」の ぶん だよ','つぎは きもちの ぶん だよ','さいごは「なぜかと いうと」の ぶん だよ'];
  let placed=0;
  const t='ぶんを じゅんばんに ならべてね。「きょうは」→ きもち →「なぜかと いうと」だよ';
  const render=()=>{
    show(`${topBar()}${stageHTML(P.code,placed?'いいね！ そのちょうし':t)}${odaiHTML()}
      <div class="slots">${L.map((l,i)=>`<div class="lineslot ${i<placed?'filled':''}"><b>${i+1}</b>${i<placed?`<span class="r-${l.r} ${i===placed-1?'pop':''}">${esc(l.t)}</span>`:''}</div>`).join('')}</div>
      <div class="tiles">${order.filter(i=>i>=placed).map(i=>`<button class="tile" type="button" data-i="${i}">${esc(L[i].t)}</button>`).join('')}</div>`);
    bindTop(); bindSay(placed?'いいね！ そのちょうし':t);
    on('.tile',e=>{
      const b=e.currentTarget, i=+b.dataset.i;
      if(i===placed){ sfx('step'); placed++; if(placed===L.length) return serve(); render() }
      else { sfx('no'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); setSay(one(NOPE)+'。'+COACH[placed]) }
    });
  };
  render(); speak(t);
}

/* ---- みずうみ・うみ・やま：あなうめ ---- */
const val=k=>({act:P.act,feel:P.feel,detail:P.detail,why:P.why,next:P.next})[k];
function todo(){ const b=['act','feel']; if(hasDetail(P.form)) b.push('detail'); b.push('why'); if(hasNext(P.form)) b.push('next'); return b.filter(k=>!val(k)) }
function templateHTML(cur){
  const slot=(k,label)=>val(k)?esc(k==='feel'?P.feel.s:val(k)):`<span class="slot ${cur===k?'cur':''}">${label}</span>`;
  const where=hasDetail(P.form)?(P.detail?esc(P.detail+P.feel.p)+' ':slot('detail','どこが')+' '):'';
  return `<div class="bowl">
    <p><span class="r-act">きょうは、${esc(when(P.ctx.s))} ${slot('act','なにを したか')}。</span></p>
    <p><span class="r-feel">${where}${slot('feel','きもち')}。</span></p>
    <p><span class="r-why">なぜかと いうと、${slot('why','わけ')}からです。</span></p>
    ${hasNext(P.form)?`<p><span class="r-next">こんどは、${slot('next','したいこと')}。</span></p>`:''}</div>`;
}
const ASK={act:'なにを した？ おだいカードを みてね',feel:'どんな きもち だった？',detail:'とくに どこが？',why:'どうして そう おもった？',next:'こんどは どうしたい？'};
function options(k){
  if(k==='act'){ const others=pick(ODAI.filter(o=>o.a!==P.ctx.a),2).map(o=>o.a); return pick([P.ctx.a,...others],3).map(a=>({label:a,ok:a===P.ctx.a,set:()=>P.act=a})) }
  if(k==='feel') return pick(FEELINGS.filter(f=>!hasDetail(P.form)||f.p),3).map(f=>({label:f.w,face:f.f,ok:true,set:()=>{P.feel=f}}));
  if(k==='detail') return P.ctx.d.map(d=>({label:d,ok:true,set:()=>P.detail=d}));
  if(k==='why') return pick(P.feel.r,P.form>=4?2:3).map(r=>({label:r+'から',ok:true,set:()=>P.why=r}));
  if(k==='next') return P.feel.x.map(x=>({label:x,ok:true,set:()=>P.next=x}));
}
function fill(){
  const left=todo(); if(!left.length) return serve();
  const k=left[0], opts=options(k), t=ASK[k];
  show(`${topBar()}${stageHTML(P.code,t)}${odaiHTML()}${templateHTML(k)}
    <div class="grid three">${opts.map((o,i)=>`<button class="card ${o.face?'':'small'}" type="button" data-i="${i}">${o.face?`<span class="face" aria-hidden="true">${o.face}</span>`:''}${esc(o.label)}</button>`).join('')}</div>`);
  bindTop(); bindSay(t); speak(t);
  on('.card',e=>{
    const b=e.currentTarget, o=opts[+b.dataset.i];
    if(!o.ok){ sfx('no'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); setSay(one(NOPE)+'。おだいカードを もういちど みてね'); return }
    sfx('step'); o.set(); fill();
  });
}

/* ---- そら：こえで ---- */

    <div class="bowl">
      <p><span class="r-act">きょうは、${esc(when(P.ctx.s))} ${P.act?esc(P.act):'<span class="slot">なにを したか</span>'}。</span></p>

/* ---- まち：かく ---- */
function kaku(){
  const parts=[
    {r:'act', g:`きょうは、${when(P.ctx.s)} 〜しました。`, t:'まず「きょうは」から かいてね'},
    {r:'feel',g:'（きもち）。', t:'つぎは きもちを かいてね'},
    {r:'why', g:'なぜかと いうと、〜からです。', t:'「なぜかと いうと」で わけを かいてね'},
    {r:'next',g:'こんどは、〜したいです。', t:'さいごに「こんどは」を かいてね'},
  ];
  let n=0, hide=false;
  const render=()=>{
    const p=parts[n];
    show(`${topBar()}${stageHTML(P.code,p.t)}${odaiHTML()}
      <div class="dots" aria-label="${n+1}ぎょうめ">${parts.map((_,i)=>`<span class="dot ${i<=n?'on':''}"></span>`).join('')}</div>
      <p class="guide"><span class="r-${p.r}" id="guide" ${hide?'hidden':''}>${esc(p.g)}</span></p>
      <div class="pad"><canvas id="cv" aria-label="ゆびで かく ところ"></canvas></div>
      <div class="row"><button class="btn" id="erase" type="button">🧽 けす</button><button class="btn" id="hide" type="button">${hide?'かたを みる':'かたを かくす'}</button></div>
      <div class="row mid"><button class="btn main" id="ok" type="button">✏️ かけた！</button></div>`);
    bindTop(); bindSay(p.t); speak(p.t);
    const cv=app.querySelector('#cv'); pad(cv);
    on('#erase',()=>pad(cv));
    on('#hide',e=>{ hide=!hide; app.querySelector('#guide').hidden=hide; e.currentTarget.textContent=hide?'かたを みる':'かたを かくす' });
    on('#ok',()=>{ sfx('step'); n++; if(n<parts.length) render(); else eat(null,'てがみ') });
  };
  render();
}
function pad(cv){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#4D4A45';
  let d=false; const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top] };
  cv.onpointerdown=e=>{ d=true; cv.setPointerCapture(e.pointerId); const [x,y]=pt(e); g.beginPath(); g.moveTo(x,y); g.lineTo(x+.1,y+.1); g.stroke() };
  cv.onpointermove=e=>{ if(!d) return; const [x,y]=pt(e); g.lineTo(x,y); g.stroke() };
  cv.onpointerup=cv.onpointercancel=()=>{ d=false };
}

/* ---- できた ごはんを よんで あげる ---- */
function serve(){
  const L=lines(), text=L.map(l=>l.t).join(''), t='わあ、ごはんが できた！ こえに だして よんで〜';
  show(`${topBar()}${stageHTML(P.code,t)}${bowlHTML(L)}
    <div class="row mid"><button class="btn main" id="read" type="button">📣 よんであげた！</button></div>
    <div class="row mid"><button class="link" id="model" type="button">🔊 さきに おてほんを きく</button></div>`);
  bindTop(); bindSay(t); speak(t);
  on('#model',()=>speak(text,false));
  on('#read',()=>eat(L));
}

/* ---- たべる → しょうたい ---- */
function eat(L,kind='ごはん'){
  hush(); sfx('chomp');
  const code=P.code, before=met(code), lookBefore=lookState(code);
  S.fed[code]=(S.fed[code]||0)+1; S.plays++; if(P.feel) S.feel[P.feel.w]=(S.feel[P.feel.w]||0)+1;
  if(!S.days.includes(today())) S.days.push(today()); S.days=S.days.slice(-60);
  const openedBefore=AREAS.map((_,i)=>areaOpen(i));
  persist();
  const nowMet=met(code), revealed=!before&&nowMet;
  const newArea=AREAS.findIndex((_,i)=>!openedBefore[i]&&areaOpen(i));
  const yum=one(YUM);
  // まず もぐもぐ
  show(`${topBar()}<div class="stage big"><div class="ykw">${img(code,lookBefore+' eat')}</div>
    <div class="bubble">${esc(yum)}</div></div>`);
  bindTop(); speak(yum);
  setTimeout(()=>{
    const left=need(code)-(S.fed[code]||0);
    const msg = revealed ? `しょうたいは… ${YOKAI[code]}！ なかまに なった！`
      : before ? `${YOKAI[code]}は まんぷく！ ありがとう！`
      : `だんだん みえてきた… あと ${left}かいで しょうたいが わかるよ`;
    show(`${topBar()}<div class="stage big"><div class="ykw">${img(code,lookState(code)+(revealed?' reveal':''))}</div>
      <div class="bubble">${esc(msg)}</div></div>
      ${!before&&!revealed?`<div class="meter" aria-label="しょうたいまで">${[...Array(need(code))].map((_,i)=>`<span class="${i<S.fed[code]?'on':''}">${i<S.fed[code]?'🍙':''}</span>`).join('')}</div>`:''}
      ${newArea>0?`<p class="got">🔓 あたらしい ばしょ「${AREAS[newArea].icon} ${esc(AREAS[newArea].name)}」が ひらいた！</p>`:''}
      <div class="row mid"><button class="btn main" id="again" type="button">もう1かい</button></div>
      <div class="row mid">${newArea>0?`<button class="btn" id="goNew" type="button">${AREAS[newArea].icon} ${esc(AREAS[newArea].name)}へ いく</button>`:''}<button class="btn" id="toHome" type="button">ずかんと ばしょ</button></div>`);
    bindTop();
    if(revealed||newArea>0) sfx('yay');
    speak(msg + (newArea>0?`。あたらしい ばしょ、${AREAS[newArea].name}が ひらいたよ`:''));
    on('#again',()=>{ sfx('tap'); startPlay(P.ai) });
    on('#goNew',()=>{ sfx('tap'); startPlay(newArea) });
    on('#toHome',()=>{ sfx('tap'); home() });
  }, 1300);
}

/* ================= ずかん ================= */
function zukan(){
  show(`<div class="top"><button class="link" id="back" type="button">← もどる</button><span class="pill">📖 ${totalMet()}/${Object.keys(YOKAI).length}ひき</span></div>
    <p class="q">ようかいずかん</p>
    ${AREAS.map((a,i)=>`<p class="zukan-h">${a.icon} ${esc(a.name)}</p><div class="zukan">${a.yk.map(c=>met(c)
      ?`<button class="mon" type="button" data-c="${c}"><img src="./img/${c}.webp" alt=""><span class="name">${esc(YOKAI[c])}</span></button>`
      :`<div class="mon lock"><img class="shadow" src="./img/${c}.webp" alt=""><span class="name">？？？</span></div>`).join('')}</div>`).join('')}`);
  on('#back',()=>{ sfx('tap'); home() });
  on('.mon[data-c]',e=>{ const c=e.currentTarget.dataset.c; sfx('tap'); speak(YOKAI[c]) });
}

title();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));

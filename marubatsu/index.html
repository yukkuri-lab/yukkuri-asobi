<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="○×ゲーム">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>○×ゲーム やろうよ！</title>
<style>
:root{--paper:#fbf7e9;--pencil:#4d4a45;--soft:#716b63;--rule:#bfd8ec;--margin:#e7b0a6;--blue:#6f92bc;--panel:rgba(255,252,241,.8)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e5dc;color:var(--pencil)}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}button,a{font:inherit;color:inherit}
.app{min-height:100dvh;max-width:760px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom)) 48px;position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 34px,var(--rule) 35px,transparent 36px);overflow:hidden}.app:before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1.5px;background:var(--margin)}.content{position:relative;z-index:1}.back{display:inline-block;text-decoration:none;font-weight:800;font-size:14px;background:rgba(255,255,255,.48);border:1px solid #a59d91;border-radius:999px;padding:8px 12px}
.title{text-align:center;font-size:clamp(27px,7vw,42px);font-weight:900;letter-spacing:.06em;margin:13px 0 4px;transform:rotate(-.7deg);text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:4px;text-underline-offset:10px}.subtitle{text-align:center;margin:20px 0 0;font-size:clamp(16px,4vw,21px);font-weight:800}.mode-area,.level-area{text-align:center;margin-top:14px}.label{font-size:13px;font-weight:900;color:var(--soft);margin-bottom:6px}.modes,.levels{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.mode,.level,.restart{min-height:46px;border:1.8px solid #8a8276;background:rgba(255,255,255,.55);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:1.5px 2px 0 rgba(78,75,70,.13);touch-action:manipulation}.mode[aria-pressed="true"],.level[aria-pressed="true"]{background:#e8eef5;border-color:#6f8195}.level-note{margin-top:6px;font-size:12px;color:var(--soft);font-weight:700}
.board-wrap{width:min(88vw,510px);margin:17px auto 0}.board{width:100%;aspect-ratio:1;display:grid;position:relative;padding:7px}.gridline{position:absolute;background:var(--pencil);opacity:.86;border-radius:999px;pointer-events:none;z-index:1}.gridline.v{top:2%;height:96%;width:3.5px;transform:translateX(-50%)}.gridline.h{left:2%;width:96%;height:3.5px;transform:translateY(-50%)}.cell{position:relative;z-index:2;border:0;background:transparent;min-width:0;min-height:0;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:5px;touch-action:manipulation}.mark{width:72%;height:72%;overflow:visible}.mark path{fill:none;stroke:var(--pencil);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.scribble{animation:pop .24s ease-out}.win-stroke{display:none;position:absolute;height:5px;width:var(--line-length,0px);background:var(--pencil);border-radius:999px;z-index:4;transform-origin:0 50%;opacity:.76;pointer-events:none}.win-stroke.draw{animation:sweep .72s ease-out forwards}
.status{max-width:530px;margin:14px auto 0;background:var(--panel);border:1.2px solid #d9cfbd;border-radius:13px;text-align:center;padding:10px 14px}.status-main{font-size:clamp(18px,4.5vw,24px);font-weight:900}.status-sub{margin-top:3px;color:var(--soft);font-size:14px;font-weight:700}.score{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;margin-top:13px;font-size:14px;font-weight:700}.score span{background:rgba(255,255,255,.35);padding:2px 7px;border-radius:8px}.actions{display:flex;justify-content:center;margin-top:14px}.restart{min-width:165px;background:#e7edf3;border-color:#77889b;font-size:17px}.foot{text-align:center;margin:14px auto 0;max-width:520px;font-size:13px;color:#686159;font-weight:700;line-height:1.7}
@keyframes pop{from{transform:scale(.78);opacity:.3}to{transform:scale(1);opacity:1}}@keyframes sweep{from{width:0}to{width:var(--line-length)}}@media(max-width:390px){.app{padding-left:40px;padding-right:10px}.app:before{left:25px}.board-wrap{width:min(91vw,460px)}.mode,.level{font-size:13px;padding-inline:11px}}
</style>
</head>
<body>
<main class="app"><div class="content">
<a class="back" href="../">← もどる</a>
<h1 class="title">○×ゲーム やろうよ！</h1>
<p class="subtitle" id="ruleText">3×3・3つ ならべたら かち！</p>
<section class="mode-area" aria-label="たいせん"><div class="label">たいせん</div><div class="modes"><button class="mode" id="cpuBtn" type="button" aria-pressed="true">コンピューターと</button><button class="mode" id="friendBtn" type="button" aria-pressed="false">おともだちと</button></div></section>
<section class="level-area" aria-label="むずかしさ"><div class="label">むずかしさ</div><div class="levels"><button class="level" data-level="1" aria-pressed="true">① かんたん</button><button class="level" data-level="2" aria-pressed="false">② ふつう</button><button class="level" data-level="3" aria-pressed="false">③ むずかしい</button></div><div class="level-note" id="levelNote">3×3のマスで、3つならべよう</div></section>
<div class="board-wrap"><div class="board" id="board" role="grid"></div></div>
<section class="status" aria-live="polite"><div class="status-main" id="statusMain">○ の ばんだよ</div><div class="status-sub" id="statusSub">あなたは ○。すきなマスを タッチしてね</div></section>
<div class="score"><span>○ <b id="scoreO">0</b>しょう</span><span>ひきわけ <b id="scoreD">0</b></span><span>× <b id="scoreX">0</b>しょう</span></div><div class="actions"><button class="restart" id="restartBtn">↻ もういちど</button></div><p class="foot" id="footerNote">基本はコンピューター対戦。おともだちと遊ぶときは「おともだちと」をタッチしてね。</p>
</div></main>
<script>
(()=>{const boardEl=document.getElementById('board'),friendBtn=document.getElementById('friendBtn'),cpuBtn=document.getElementById('cpuBtn'),restartBtn=document.getElementById('restartBtn'),statusMain=document.getElementById('statusMain'),statusSub=document.getElementById('statusSub'),footerNote=document.getElementById('footerNote'),scoreO=document.getElementById('scoreO'),scoreX=document.getElementById('scoreX'),scoreD=document.getElementById('scoreD'),ruleText=document.getElementById('ruleText'),levelNote=document.getElementById('levelNote'),levelBtns=[...document.querySelectorAll('.level')];const configs={1:{size:3,target:3},2:{size:4,target:3},3:{size:5,target:4}};let level=1,size=3,target=3,lines=[],board=[],cells=[],turn='O',mode='cpu',gameOver=false,thinking=false,winningLine=null;const scores={O:0,X:0,D:0};function makeLines(n,k){const out=[];for(let r=0;r<n;r++)for(let c=0;c<=n-k;c++)out.push(Array.from({length:k},(_,j)=>r*n+c+j));for(let c=0;c<n;c++)for(let r=0;r<=n-k;r++)out.push(Array.from({length:k},(_,j)=>(r+j)*n+c));for(let r=0;r<=n-k;r++)for(let c=0;c<=n-k;c++)out.push(Array.from({length:k},(_,j)=>(r+j)*n+c+j));for(let r=0;r<=n-k;r++)for(let c=k-1;c<n;c++)out.push(Array.from({length:k},(_,j)=>(r+j)*n+c-j));return out}function svg(mark){if(mark==='O')return `<svg class="mark scribble" viewBox="0 0 100 100"><path d="M 50 11 C 26 8,11 26,12 51 C 13 76,29 91,52 89 C 77 88,91 72,89 48 C 88 24,73 11,50 11 Z"/></svg>`;return `<svg class="mark scribble" viewBox="0 0 100 100"><path d="M 18 17 C 37 36,61 61,82 83"/><path d="M 82 18 C 63 37,39 61,18 82"/></svg>`}function buildBoard(){boardEl.innerHTML='';boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;boardEl.style.gridTemplateRows=`repeat(${size},1fr)`;for(let j=1;j<size;j++){const v=document.createElement('div');v.className='gridline v';v.style.left=`${j*100/size}%`;boardEl.appendChild(v);const h=document.createElement('div');h.className='gridline h';h.style.top=`${j*100/size}%`;boardEl.appendChild(h)}for(let i=0;i<size*size;i++){const b=document.createElement('button');b.className='cell';b.type='button';b.addEventListener('click',()=>play(i));boardEl.appendChild(b)}const s=document.createElement('div');s.className='win-stroke';s.id='winStroke';boardEl.appendChild(s);cells=[...boardEl.querySelectorAll('.cell')]}function winner(mark){return lines.find(line=>line.every(i=>board[i]===mark))||null}function drawWin(){const s=document.getElementById('winStroke');if(!s||!winningLine)return;const a=cells[winningLine[0]].getBoundingClientRect(),z=cells[winningLine[winningLine.length-1]].getBoundingClientRect(),base=boardEl.getBoundingClientRect(),x1=a.left-base.left+a.width/2,y1=a.top-base.top+a.height/2,x2=z.left-base.left+z.width/2,y2=z.top-base.top+z.height/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);s.style.display='block';s.style.left=`${x1}px`;s.style.top=`${y1}px`;s.style.setProperty('--line-length',`${len}px`);s.style.transform=`translateY(-50%) rotate(${Math.atan2(dy,dx)}rad)`;s.classList.remove('draw');void s.offsetWidth;s.classList.add('draw')}function render(){cells.forEach((c,i)=>{c.innerHTML=board[i]?svg(board[i]):'';c.disabled=gameOver||thinking||!!board[i]});if(winningLine)requestAnimationFrame(drawWin)}function updateScores(){scoreO.textContent=scores.O;scoreX.textContent=scores.X;scoreD.textContent=scores.D}function finish(mark){const w=winner(mark);if(w){winningLine=w;gameOver=true;scores[mark]++;updateScores();statusMain.textContent=`${mark==='O'?'○':'×'} が ${target}つ ならんだ！`;statusSub.textContent='やったー！ いい しょうぶだったね';render();return true}if(board.every(Boolean)){gameOver=true;scores.D++;updateScores();statusMain.textContent='ひきわけ！';statusSub.textContent='いい しょうぶ！';render();return true}return false}function cpuChoice(){const empty=board.map((v,i)=>v?null:i).filter(i=>i!==null);for(const i of empty){board[i]='X';const ok=winner('X');board[i]='';if(ok)return i}for(const i of empty){board[i]='O';const ok=winner('O');board[i]='';if(ok)return i}const center=(size-1)/2;let best=empty[0],bestScore=-1e9;for(const i of empty){const r=Math.floor(i/size),c=i%size;let s=-(Math.abs(r-center)+Math.abs(c-center))+Math.random()*.3;for(const line of lines)if(line.includes(i)){let own=0,opp=0;for(const p of line){if(board[p]==='X')own++;if(board[p]==='O')opp++}if(!opp)s+=own*2;if(!own)s+=opp*1.5}if(s>bestScore){bestScore=s;best=i}}return best}function cpuMove(){thinking=true;statusMain.textContent='× が かんがえちゅう…';statusSub.textContent='ちょっと まってね';render();setTimeout(()=>{const i=cpuChoice();if(Number.isInteger(i))board[i]='X';thinking=false;if(!finish('X')){turn='O';statusMain.textContent='○ の ばんだよ';statusSub.textContent='あなたは ○。すきなマスを タッチしてね';render()}},430)}function play(i){if(gameOver||thinking||board[i])return;board[i]=turn;render();if(finish(turn))return;if(mode==='cpu'&&turn==='O'){turn='X';cpuMove()}else{turn=turn==='O'?'X':'O';statusMain.textContent=`${turn==='O'?'○':'×'} の ばんだよ`;statusSub.textContent='あいてのマークも よくみてね';render()}}function reset(){board=Array(size*size).fill('');turn='O';gameOver=false;thinking=false;winningLine=null;statusMain.textContent='○ の ばんだよ';statusSub.textContent=mode==='cpu'?'あなたは ○。すきなマスを タッチしてね':'おともだちと こうたいで マスを タッチしてね';footerNote.textContent=mode==='cpu'?'基本はコンピューター対戦。おともだちと遊ぶときは「おともだちと」をタッチしてね。':'おともだちと交代で ○と×を置いてね。';render()}function setMode(m){mode=m;friendBtn.setAttribute('aria-pressed',String(m==='friend'));cpuBtn.setAttribute('aria-pressed',String(m==='cpu'));scores.O=scores.X=scores.D=0;updateScores();reset()}function setLevel(l){level=l;size=configs[l].size;target=configs[l].target;lines=makeLines(size,target);levelBtns.forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.level)===l)));ruleText.textContent=`${size}×${size}・${target}つ ならべたら かち！`;levelNote.textContent=`${size}×${size}のマスで、${target}つならべよう`;buildBoard();scores.O=scores.X=scores.D=0;updateScores();reset()}friendBtn.addEventListener('click',()=>setMode('friend'));cpuBtn.addEventListener('click',()=>setMode('cpu'));restartBtn.addEventListener('click',reset);levelBtns.forEach(b=>b.addEventListener('click',()=>setLevel(Number(b.dataset.level))));setLevel(1);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
</script>
</body></html>
